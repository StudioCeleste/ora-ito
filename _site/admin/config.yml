backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "projects"
    label: "Projets (Studio)"
    folder: "src/studio"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "project.njk"}
      - {label: "Langue", name: "locale", widget: "select", options: ["fr", "en"], default: "fr"}
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Catégorie", name: "category", widget: "string", required: false}
      - {label: "Marque", name: "brand", widget: "string", required: false}
      - {label: "Collection", name: "collection", widget: "string", required: false}
      - {label: "Année", name: "year", widget: "string", required: false}
      - {label: "Contenu Textuel", name: "body", widget: "markdown"}
      - {label: "Galerie d'images", name: "gallery", widget: "list", field: {label: "Image", name: "image", widget: "image"}, required: false}

  - name: "news"
    label: "Actualités (News)"
    folder: "src/news"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "article.njk"}
      - {label: "Langue", name: "locale", widget: "select", options: ["fr", "en"], default: "fr"}
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Date", name: "published_date", widget: "string"}
      - {label: "Tag Projet", name: "project_tag", widget: "string", required: false}
      - {label: "Contenu Textuel", name: "body", widget: "markdown"}
      - {label: "Galerie d'images", name: "gallery", widget: "list", field: {label: "Image", name: "image", widget: "image"}, required: false}
