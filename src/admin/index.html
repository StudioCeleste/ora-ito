<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMS - Studio Ora-ïto</title>
  <link href="config.yml" type="text/yaml" rel="cms-config-url">
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.1.2/dist/decap-cms.js"></script>
</head>
<body>
  <div id="error-log" style="color: red; font-family: monospace; padding: 20px;"></div>
  <script>
    window.addEventListener('error', function(e) {
      document.getElementById('error-log').innerHTML += '<p>Error: ' + e.message + '<br>Line: ' + e.lineno + '</p>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.getElementById('error-log').innerHTML += '<p>Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</p>';
    });
  </script>
</body>
</html>
